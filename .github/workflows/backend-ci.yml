name: Backend CI # validates WhatsApp PN/LID participant targeting

on:
  pull_request:
    branches:
      - main
      - fix/whatsapp-community-add-diagnostics-2026-11-12
      - fix/whatsapp-join-via-announcements-2026-11-14
  push:
    branches:
      - main
      - fix/community-discovery-forbidden-2026-11-12
      - fix/community-rate-limit-2026-11-12
      - fix/whatsapp-registration-access-2026-11-12
      - fix/whatsapp-community-add-diagnostics-2026-11-12
      - fix/whatsapp-join-via-announcements-2026-11-14

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
