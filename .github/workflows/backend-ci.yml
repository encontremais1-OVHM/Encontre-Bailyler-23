name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - fix/community-discovery-forbidden-2026-11-12

permissions:
  contents: read

jobs:
  typecheck-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
